general {
    hide_cursor = true
    screen_copy_mode = 0
    file_timeout = 1000
}

background {
    monitor =
    path = /home/copa/Pictures/Wallpapers/anime-black-hole.jpg
    blur_passes = 3
    blur_size = 4
}

input-field {
    monitor =
    size = 200, 45
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rbg(200, 200, 200)
    fade_on_empty = false
    font_family = Fira Code
    font_color = rgba(255, 255, 255, 0.9)
    placeholder_text = <span>-> Enter Password</span>
    hide_input = false
    position = 0, -425
    rounding = -1
}

label {
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 85
    font_family = Fira Code Bold
    position = 0, 310
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo -e "$(date +"%A, %B, %d")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 24
    font_family = Fira Code Semibold
    position = 0, 400
}

image {
    path = /home/copa/.config/hypr/hyprlock/saber.jpg
    border_color = 0xffdddddd
    border_size = 0
    size = 200
    position = 0, -265
}

label {
    text = cmd[update:1000] echo "$(bash ~/.config/hypr/hyprlock/scripts/spotify-playing.sh)"
    color = rgba(255, 255, 255, 0.7)
    font_size = 18
    font_family = Iosevka Nerd Font Propo
    position = 100, 0
    halign = left
}

label {
    text = cmd[update:1000] echo "$(bash ~/.config/hypr/hyprlock/scripts/weather.sh)"
    color = rgba(255, 255, 255, 0.7)
    shadow_passes = 1
    shadow_boost = 0.5
    font_size = 18
    font_family = Iosevka Nerd Font Propo
    position = 95.5, -40
    halign = left
}
